services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_hrm
    restart: unless-stopped
    environment:
      POSTGRES_DB: hrmdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}   
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: myapi_hrm
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Database=hrmdb;Username=postgres;Password=${DB_PASSWORD}
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8082}
    container_name: myfrontend_hrm
    restart: unless-stopped
    env_file: .env.web
    ports:
      - "3002:3000"
    depends_on:
      - api

volumes:
  postgres_data: